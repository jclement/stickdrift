[tools]
node = "24.16.0"
bun = "1.3.14"

# controller runs on Cloudflare Workers: one Durable Object per room relays
# phones (pads) to a game (host). Vite builds the pages into dist/client.

[tasks.setup]
description = "Install dependencies (idempotent)"
run = "bun install --frozen-lockfile"

[tasks.build]
description = "Build the pages and the host SDK into dist/client"
run = ["bunx vite build", "bunx vite build -c vite.sdk.config.ts", "cp PROTOCOL.md dist/client/protocol.md"]

[tasks.dev]
description = "Local Worker + Durable Objects at http://localhost:8787 (rebuild pages with mise run build)"
depends = ["build"]
run = "bunx wrangler dev --ip 0.0.0.0"

[tasks.test]
description = "Unit and relay integration tests (Workers runtime)"
run = "bunx vitest run"

[tasks.lint]
description = "Typecheck worker and client (read-only)"
run = "bunx tsc -b --noEmit"

[tasks.fmt]
description = "No formatter configured; tsc is the gate"
run = "echo 'nothing to format'"

[tasks.check]
description = "Everything that must pass before calling work done"
depends = ["lint", "test"]

[tasks.deploy]
description = "Build and deploy to controller.onewheelgeek.net (stamps a build id so phones self-update)"
run = """
export BUILD="$(git rev-parse --short HEAD)-$(date +%s)"
bunx vite build && bunx vite build -c vite.sdk.config.ts && cp PROTOCOL.md dist/client/protocol.md
bunx wrangler deploy --var BUILD:$BUILD
"""

[tasks."dev:reset"]
description = "Remove build output and local Durable Object state"
run = "rm -rf dist .wrangler"
